<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>咖啡图文介绍 - transition</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="coffee-list">
    <figure class="coffee">
      <img src="image/1.jpg" alt="Cappuccino">
      <figcaption class="caption">
        <h2>Cappuccino</h2>
        <p>这款咖啡沿袭传统技法，由我们技艺娴熟的咖啡吧员将手工制作的热奶与细腻奶泡轻柔地浇在浓缩咖啡之上制作而成。</p>
      </figcaption>
    </figure>

    <figure class="coffee">
      <img src="image/2.jpg" alt="Mocha">
      <figcaption class="caption">
        <h2>Mocha</h2>
        <p>这款咖啡由醇香的摩卡酱，浓缩咖啡和蒸奶相融相合，上面覆以搅打奶油。寒冷的日子里，忧伤的时光中，任何人都无法抵抗她的诱惑。</p>
      </figcaption>
    </figure>

    <figure class="coffee">
      <img src="image/3.jpg" alt="Espresso">
      <figcaption class="caption">
        <h2>Espresso</h2>
        <p>这是咖啡的精粹，以最浓缩的方式显现。浓缩咖啡带点焦糖味道，浓厚馥郁。</p>
      </figcaption>
    </figure>
  </div>
</body>
</html>
