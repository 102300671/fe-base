<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>work3</title>
  <link rel="stylesheet" href="../assets/css/style.css">
  <style>
    table {
      counter-reset: row;
      border-collapse: collapse;
    }
    th {
      background: #EC205E;
      color: white;
      text-align: left;
      padding: 10px 8px;
    }
    tbody tr {
      counter-increment: row;
    }
    th,
    td {
      border-bottom: 1px dashed #3e3e3e;
    }
    td {
      padding: 3px 3px;
      vertical-align: middle;
    }
    td::before {
      content: counter(row);
      color: white;
      background: url(assets/images/dot_01.gif) no-repeat center;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin: 3px 3px;
      width: 20px;
      height: 18px;
    }
    tr:hover td {
      color: red;
    }
    tr:hover td::before {
      background: url(assets/images/dot_02.gif) no-repeat center;
    }
  </style>
</head>
<body>
  <table>
    <thead>
      <tr><th>大家都喜欢买的美容品</th></tr>
    </thead>
    <tbody>
      <tr><td>雅诗兰黛即时修护眼部精华霜15ml</td></tr>
      <tr><td>伊丽莎白雅顿显效复合活肤霜 75ml</td></tr>
      <tr><td>OLAY玉兰油多效修护霜 50g</td></tr>
      <tr><td>巨型一号丝瓜水320ML</td></tr>
      <tr><td>倩碧保湿洁肤水2号 200ml</td></tr>
      <tr><td>比度克细肤淡印霜 30g</td></tr>
      <tr><td>兰芝 (LANEIGE)夜间修护锁水面膜 80ml</td></tr>
      <tr><td>SK-II护肤精华露 215ml</td></tr>
      <tr><td>欧莱雅青春密码活颜精华肌底液</td></tr>
    </tbody>
  </table>
</body>
</html>
