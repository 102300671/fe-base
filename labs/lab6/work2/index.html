<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="assets/css/style.css">
  <title>grid布局</title>
</head>
<body>
  <main class="layout">
    <article class="card card-banner card-1">
      <img class="card-img" src="assets/img/img1.JPG" alt="淘宝3.8节主会场，汇聚必逛好店">
      <div class="card-overlay">
        <p class="card-overlay-title">淘宝3.8节主会场，汇聚必逛好店</p>
        <p class="card-overlay-meta"><span class="card-ad">广告</span>淘宝</p>
      </div>
    </article>

    <article class="card card-2">
      <img class="card-img" src="assets/img/img2.JPG" alt="又一“公主号”邮轮中招，3000人被困海上">
      <div class="card-body">
        <p class="card-cat">要闻</p>
        <h3 class="card-title">图说天下 | 又一“公主号”邮轮中招：3000人被困海上 加州进入紧急状态</h3>
      </div>
      <p class="card-source"><span class="card-dot"></span>MSN</p>
    </article>

    <article class="card card-3">
      <img class="card-img" src="assets/img/img3.JPG" alt="佟丽娅大胆掀开被子，却忘了自己穿着睡裤">
      <div class="card-body">
        <p class="card-cat">娱乐</p>
        <h3 class="card-title">佟丽娅大胆掀开被子，却忘了自己穿着“睡裤”，网友：沦陷了啊！</h3>
      </div>
      <p class="card-source"><span class="card-dot"></span>愚伯朴</p>
    </article>

    <article class="card card-4">
      <img class="card-img" src="assets/img/img4.JPG" alt="乔布斯遗孀将裸捐250亿美元">
      <div class="card-body">
        <p class="card-cat">财经</p>
        <h3 class="card-title">乔布斯遗孀将裸捐250亿美元，自称没兴趣积累财富</h3>
      </div>
      <p class="card-source"><span class="card-dot"></span>愚伯朴</p>
    </article>

    <article class="card card-5">
      <img class="card-img" src="assets/img/img5.JPG" alt="天猫3.8主会场，满300减30">
      <div class="card-body">
        <h3 class="card-title">天猫3.8主会场 | 满300减30，快来加购</h3>
      </div>
      <p class="card-source"><span class="card-dot"></span>天猫精选</p>
    </article>

    <article class="card card-6">
      <img class="card-img" src="assets/img/img6.JPG" alt="杨迪兄妹，哥哥长得像小丑，妹妹却貌美如花">
      <div class="card-body">
        <p class="card-cat">生活</p>
        <h3 class="card-title">有种“不公平”叫杨迪兄妹，哥哥长得像“小丑”，妹妹却貌美如花</h3>
      </div>
      <p class="card-source"><span class="card-dot"></span>东方头条</p>
    </article>

    <article class="card card-7">
      <img class="card-img" src="assets/img/img7.JPG" alt="孙杨还有可能参加东京奥运会吗">
      <div class="card-body">
        <p class="card-cat">体育</p>
        <h3 class="card-title">孙杨还有可能参加东京奥运会吗，该如何上诉？体育法专家、CAS仲裁员深度解读…</h3>
      </div>
      <p class="card-source"><span class="card-dot"></span>解放日报</p>
    </article>
  </main>
</body>
</html>
