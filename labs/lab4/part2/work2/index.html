<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大学生暑期社会实践调查问卷</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div class="page">

  <h1>大学生暑期社会实践调查问卷</h1>

  <p class="hello">亲爱的同学：大家好！</p>
  <p class="intro">为了更好的了解人们对近年来计算机类专业填报火热现象的看法，特制定本问卷，希望得到您的配合，请认真阅读并回答以下问题，您的回答将直接影响本调查的可信度和有效性，真诚感谢您的支持，祝您天天愉快，谢谢！</p>

  <form action="#" method="post">

    <p class="q"><span class="num">1.</span> 您的性别：
      <label><input type="radio" name="sex" value="男"> 男</label>
      <label><input type="radio" name="sex" value="女"> 女</label>
    </p>

    <p class="q"><span class="num">2.</span> 您的学校：
      <input type="text" name="school" size="30">
    </p>

    <p class="q"><span class="num">3.</span> 您的年级：
      <select name="grade">
        <option>请选择您的年级</option>
        <option>大一</option>
        <option>大二</option>
        <option>大三</option>
        <option>大四</option>
        <option>大专</option>
      </select>
    </p>

    <p class="q"><span class="num">4.</span> 报考该专业的原因：
    </p>
    <p class="opts">
      <label><input type="checkbox" name="reason" value="自己感兴趣"> 自己感兴趣</label>
      <label><input type="checkbox" name="reason" value="对将来发展有利"> 对将来发展有利</label>
      <label><input type="checkbox" name="reason" value="适应社会"> 适应社会</label>
      <label><input type="checkbox" name="reason" value="父母主张"> 父母主张</label>
      <label><input type="checkbox" name="reason" value="老师建议"> 老师建议</label>
      <label><input type="checkbox" name="reason" value="学校调剂"> 学校调剂</label>
      <label><input type="checkbox" name="reason" value="其他"> 其他</label>
    </p>

    <p class="q"><span class="num">5.</span> 您对该专业的建议：
    </p>
    <p class="opts">
      <label><input type="checkbox" name="advice" value="招收时重质不重量"> 招收时重质不重量</label>
      <label><input type="checkbox" name="advice" value="师资力量要改进"> 师资力量要改进</label>
      <label><input type="checkbox" name="advice" value="要更适应社会需要"> 要更适应社会需要</label>
      <label><input type="checkbox" name="advice" value="加强专业实验室建设"> 加强专业实验室建设</label>
      <label><input type="checkbox" name="advice" value="其他"> 其他</label>
    </p>

    <p class="q"><span class="num">6.</span> 您认为该专业学生有必要参加社会实践：
      <label><input type="radio" name="practice" value="有必要"> 有必要</label>
      <label><input type="radio" name="practice" value="没有必要"> 没有必要</label>
      <label><input type="radio" name="practice" value="无所谓"> 无所谓</label>
    </p>

    <p class="q"><span class="num">7.</span> 您的父母是否赞成您读该专业：
      <label><input type="radio" name="parent" value="很赞成，希望如此"> 很赞成，希望如此</label>
      <label><input type="radio" name="parent" value="一般，不是很高兴"> 一般，不是很高兴</label>
      <label><input type="radio" name="parent" value="不了解"> 不了解</label>
    </p>

    <p class="q"><span class="num">8.</span> 您对学校的建议：
    </p>
    <p class="opts">
      <textarea name="suggestion" rows="5" cols="100">请您提出宝贵的建议</textarea>
    </p>

    <p class="btns">
      <input type="submit" value="提交答案">
      <input type="reset" value="清空">
    </p>

  </form>

  <p class="copyright">版权所有：计算机科学与技术系软件工程教研室 copy right&copy;2015-2020</p>

</div>

</body>
</html>
